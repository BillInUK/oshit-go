version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: microservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nacos:
    image: nacos/nacos-server:v2.2.0
    environment:
      MODE: standalone
    ports:
      - "8848:8848"

  account-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile-accountapi
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - nacos
    environment:
      DATABASE_HOST: postgres
      REDIS_ADDR: redis:6379
      NACOS_HOST: nacos

  account-rpc:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile-accountrpc
    ports:
      - "20880:20880"
    depends_on:
      - postgres
      - redis
      - nacos
    environment:
      DATABASE_HOST: postgres
      REDIS_ADDR: redis:6379
      NACOS_HOST: nacos

volumes:
  postgres_data:
