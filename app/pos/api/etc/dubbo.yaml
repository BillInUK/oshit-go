dubbo:
  application:
    name: pos-api
  logger:
    driver: zap
    level: warn
    format: json
    appender: console,file
    file-name: pos-api-dubbo.log
    file-max-size: 200
    file-compress: true
  otel:
    trace-config:
      enable: false
  metrics:
    enable: false
  shutdown:
    offline-request-window-timeout: 3s
  provider:
    services: {}
    filter: -grpc_health, -grpc_reflection
