app:
  name: "reward-api"
  port: 1200

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "oshit_db"
  sslmode: "disable"

redis:
  addr: "localhost"
  port: 6379
  password: ""
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  consumer:
    group_id: "reward-service"
    topics:
      - "ServiceTransaction"

nacos:
  server_config:                    # Nacos服务端配置（集群模式可添加多个server_config）
    - host: "127.0.0.1"
      port: 8848
      grpc_port: 9848
  client_config:                    # Nacos客户端配置（匹配服务端认证/命名空间配置）
    namespace_id: "public"          # 命名空间（public/自定义）
    timeout_ms: 5000                # 超时时间
    not_load_cache_at_start: true   # 启动不加载本地缓存
    log_dir: "./log/nacos"          # 日志目录（api/下相对路径）
    cache_dir: "./cache/nacos"      # 缓存目录（api/下相对路径）
    log_level: "info"               # 日志级别
    username: "nacos"               # Nacos用户名
    password: "lJPQwjjO9k"          # Nacos密码

  subscribe_config:                 # Nacos订阅配置（要读取的业务配置标识）
    data_id: "reward-api-config"    # 业务配置DataId
    group: "DEFAULT_GROUP"          # 业务配置Group